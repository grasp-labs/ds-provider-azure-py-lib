package-name: azure
name: azure
description: Azure provider for the DS Business Workflow

linked_service:
  - name: Azure
    type: DS.RESOURCE.LINKED_SERVICE.AZURE_STORAGE_ACCOUNT
    version: 1.0.0
    description: Azure linked service
    class_name: ds_provider_azure_py_lib.linked_service.azure.AzureLinkedService

dataset:
  - name: Azure
    type: DS.RESOURCE.DATASET.AZURE_BLOB
    version: 1.0.0
    description: Azure blob dataset
    class_name: ds_provider_azure_py_lib.dataset.AzureBlob

  - name: Azure
    type: DS.RESOURCE.DATASET.AZURE_TABLE
    version: 1.0.0
    description: Azure table dataset
    class_name: ds_provider_azure_py_lib.dataset.AzureTable
